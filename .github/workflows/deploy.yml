name: Build & Deploy to Azure App Service

# Every push to main zip-deploys the source to the App Service, which builds it
# server-side (Oryx runs pip install from requirements.txt because
# SCM_DO_BUILD_DURING_DEPLOYMENT=true on the app).
#
# This is a CODE deploy, not a container deploy. The Dockerfile is kept for
# running the app locally and is not used here.
#
# Two things about this app differ from a stateless API and are enforced on the
# App Service itself, not by this workflow — see DEPLOY.md:
#   · session state is a SQLite file under /home, so the app must run on
#     exactly ONE instance
#   · the interaction logger is a background task, so Always On must stay enabled

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.env.example'
      - 'tests/**'
  workflow_dispatch:

env:
  # ── EDIT THIS ─────────────────────────────────────────────────────
  AZURE_WEBAPP_NAME: EurekaForbes-Chat
  # ──────────────────────────────────────────────────────────────────
  # The hostname is NOT hard-coded: App Services get a randomised suffix, so it
  # is read from the deploy action's own output below.
  AZURE_HEALTH_PATH: /health
  PYTHON_VERSION: '3.11'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to App Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v5

      # Not used to build the deployment payload — Oryx does that on the App
      # Service. This only compiles the sources so a syntax error fails here
      # rather than at container start, where it shows up as an opaque 503.
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Byte-compile sources
        run: python -m compileall -q chatbot

      # tests/ and the local venv are excluded from the payload; everything else
      # tracked in the repo ships, including prompts/ and knowledge/.
      - name: Stage deployment package
        run: |
          mkdir -p /tmp/pkg
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' \
                --exclude '.venv' --exclude '__pycache__' --exclude '*.pyc' \
                ./ /tmp/pkg/
          echo "staged $(find /tmp/pkg -type f | wc -l) files"

      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: /tmp/pkg

      # A hand-copied hostname goes stale the moment the app is recreated, and the
      # health gate then fails against a host that no longer exists. Take it from the
      # deploy step; fall back to the default form only if the action returned nothing.
      - name: Resolve health URL
        id: url
        env:
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          base="${WEBAPP_URL:-https://${AZURE_WEBAPP_NAME}.azurewebsites.net}"
          base="${base%/}"
          echo "health=${base}${AZURE_HEALTH_PATH}" >> "$GITHUB_OUTPUT"
          echo "Health URL: ${base}${AZURE_HEALTH_PATH}"

      # An Oryx build plus a cold start takes a while, and the OLD worker keeps
      # answering 200 while it happens — so a plain poll can go green against the
      # build we just replaced. Wait for the site to actually go down or change
      # before believing any 200.
      - name: Wait for /health
        env:
          HEALTH_URL: ${{ steps.url.outputs.health }}
        run: |
          sleep 30
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$HEALTH_URL" || echo 000)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then
              echo "::notice::$HEALTH_URL is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$HEALTH_URL never returned 200 (last: $code)"
          exit 1

      # A green deploy that lost its CRM or channel credentials is worse than a
      # failed one — it answers customers with nothing behind it.
      - name: Verify wiring
        env:
          HEALTH_URL: ${{ steps.url.outputs.health }}
        run: |
          body=$(curl -s --max-time 15 "$HEALTH_URL")
          echo "$body"
          echo "$body" | grep -q '"dataverse_configured": *true' \
            || echo "::warning::Dataverse is not configured — CRM tools will fail"
          for ch in whatsapp facebook instagram; do
            echo "$body" | grep -q "\"$ch\": *true" \
              || echo "::warning::$ch credentials missing — replies will not send"
          done
